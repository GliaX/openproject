name: build-image

# Build and publish the custom OpenProject image (upstream + the
# openproject-meeting_markdown_export plugin) when the Dockerfile/plugin files
# change, or on manual dispatch. The Actions GITHUB_TOKEN has packages:write,
# so no extra secrets are needed.
#
# NOTE on base-image drift: the upstream `openproject/openproject:17` tag is a
# moving target. The image currently deployed (ghcr.io/gliax/openproject:17.0.4)
# was imported from the prior Docker-host build to preserve the exact running
# version. Re-running this workflow rebuilds against the LATEST :17 (an
# effective OpenProject upgrade) — do so deliberately and run the in-app
# migrations. See README.md "Image build & version drift".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (also pushed as :latest)"
        required: true
        default: "17.0.4"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/gliax/openproject:${{ inputs.tag }}
            ghcr.io/gliax/openproject:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
