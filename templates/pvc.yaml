{{- if .Values.persistence.assets.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openproject.fullname" . }}-assets
  namespace: {{ include "openproject.namespace" . }}
  labels:
    {{- include "openproject.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.assets.accessMode | quote }}
  storageClassName: {{ .Values.persistence.assets.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.assets.size | quote }}
{{- end -}}
