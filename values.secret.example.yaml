# Reference for the secret overlay. This file documents the SHAPE of the secrets
# only — real values are NEVER committed. They are stored as GitHub Actions
# secrets and turned into the `openproject-secrets` Kubernetes Secret by
# .github/workflows/deploy.yml at deploy time.
#
# Required GitHub Actions (repo) secrets:
#
#   DATABASE_URL          postgresql://user:pass@host:port/db?sslmode=require
#                         (DigitalOcean managed Postgres connection string)
#   SECRET_KEY_BASE       Rails secret_key_base (long random string)
#   ENTERPRISE_TOKEN_RB   contents of app/models/enterprise_token.rb
#                         (the enterprise feature shim, mounted read-only)
#   DIGITALOCEAN_ACCESS_TOKEN
#                         DO API token (doctl kubeconfig for the deploy job)
#
# The resulting K8s Secret `openproject-secrets` has these keys:
#   DATABASE_URL          (literal)
#   SECRET_KEY_BASE       (literal)   -> exposed as OPENPROJECT_SECRET_KEY_BASE
#   enterprise_token.rb   (file)      -> mounted at /app/app/models/enterprise_token.rb
